{# Chart.js wiring for the dashboard. Extracted so the page markup stays readable. #}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Changing category/unit/year invalidates the indicator selection: clear it before
// the GET submit so the URL never carries an id from the previous filter set.
window.arimaMutuFilterChange = function (el) {
    const form = el.form;
    const ind = form ? form.querySelector('[name="mutu_indikator"]') : null;
    if (ind) { ind.value = ''; }
    if (form) { form.submit(); }
};
document.addEventListener('DOMContentLoaded', function() {
    // Kategori / tahun berubah → muat ulang daftar indikator, kosongkan
    // pilihan indikator (indikator lama milik kategori lain), lalu submit
    // supaya grafik langsung menampilkan rata-rata kategori baru.
    function reloadIndikator(andSubmit) {
        const jenis = document.getElementById('filterMutuJenis');
        const tahun = document.getElementById('filterMutuTahun');
        const ind = document.getElementById('filterMutuIndikator');
        if (!jenis || !tahun || !ind) return;
        const url = "{% url 'akreditasi:api_mutu_indikator' %}?jenis="
            + encodeURIComponent(jenis.value) + "&tahun=" + encodeURIComponent(tahun.value);
        fetch(url).then(r => r.json()).then(data => {
            ind.innerHTML = '<option value="">Semua Indikator (Rata-rata)</option>';
            (data.indikator || []).forEach(function (i) {
                const o = document.createElement('option');
                o.value = i.id;
                o.textContent = '[' + i.kode + '] ' + i.nama + (i.punya_data ? '' : ', belum ada data');
                ind.appendChild(o);
            });
            if (andSubmit) ind.form.submit();
        });
    }
    document.getElementById('filterMutuJenis')?.addEventListener('change', function () { reloadIndikator(true); });
    document.getElementById('filterMutuTahun')?.addEventListener('change', function () { reloadIndikator(true); });

    // Validasi form: "Semua Indikator" = rata-rata, bukan error. Kontrol
    // dinonaktifkan agar URL bersih (tanpa mutu_indikator=).
    document.querySelector('form[method="GET"]')?.addEventListener('submit', function (e) {
        const ind = document.getElementById('filterMutuIndikator');
        if (ind && ind.value === '') ind.disabled = true;
    });

    // ── Shared chart helpers: value labels + drill-down ──────────────────
    const MUTU_IND_ID   = "{{ filter_mutu_indikator|default:'' }}";
    const MUTU_IND_NAMA = "{{ mutu_indikator_terpilih.nama_indikator|escapejs|default:'' }}";
    const MUTU_IND_KODE = "{{ mutu_indikator_terpilih.kode_indikator|escapejs|default:'' }}";
    const MUTU_TAHUN    = {{ filter_mutu_tahun }};
    const MUTU_ARAH     = "{{ mutu_arah_target }}";
    const MUTU_TARGET   = {{ chart_mutu_target_val_json|safe }};
    const PDCA_URL_BASE = "{% url 'akreditasi:risiko_input' %}";
    const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni',
                        'Juli','Agustus','September','Oktober','November','Desember'];

    // Number formatting: Indonesian decimal comma, grouped thousands. Every
    // axis, label and tooltip goes through these so a value never reads two
    // different ways on the same screen.
    const fmtNum = (v, digits) => (v === null || v === undefined)
        ? '-'
        : Number(v).toLocaleString('id-ID', {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits,
        });
    const fmtPct = (v, digits) => (v === null || v === undefined)
        ? 'Belum ada data'
        : fmtNum(v, digits === undefined ? 1 : digits) + '%';

    // Inline plugin: draws the value above every non-null bar of the first bar
    // dataset. Skips bars too narrow to hold the text instead of overlapping.
    const valueLabelsPlugin = {
        id: 'valueLabels',
        afterDatasetsDraw(chart) {
            const barIndex = chart.data.datasets.findIndex(d => d.type === 'bar');
            if (barIndex < 0) return;
            const ctx = chart.ctx;
            const meta = chart.getDatasetMeta(barIndex);
            const data = chart.data.datasets[barIndex].data;
            ctx.save();
            ctx.font = "500 10px 'IBM Plex Mono', ui-monospace, monospace";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const widths = meta.data.map(el => el.width || 0).filter(Boolean);
            const room = widths.length ? Math.min.apply(null, widths) : 0;
            meta.data.forEach(function (bar, i) {
                const v = data[i];
                if (v === null || v === undefined) return;
                const label = fmtNum(v, 1) + '%';
                if (room && ctx.measureText(label).width > room - 4) return;
                ctx.fillStyle = '#141C2E';
                const y = Math.max(bar.y - 4, ctx.measureText(label).width ? 10 : 10);
                ctx.fillText(label, bar.x, y);
            });
            ctx.restore();
        }
    };

    function openDrilldown(idx, val) {
        const modalEl = document.getElementById('modalDrilldownMutu');
        if (!modalEl) return;
        const below = (MUTU_ARAH === 'MAX') ? (val > MUTU_TARGET) : (val < MUTU_TARGET);
        document.getElementById('dd-bulan-label').textContent = NAMA_BULAN[idx] + ' ' + MUTU_TAHUN;
        document.getElementById('dd-indikator-nama').textContent = MUTU_IND_ID
            ? '[' + MUTU_IND_KODE + '] ' + MUTU_IND_NAMA
            : 'Rata-rata semua indikator terfilter';
        document.getElementById('dd-nilai').textContent = fmtPct(val, 1);
        document.getElementById('dd-target').textContent = fmtPct(MUTU_TARGET);
        const gap = val - MUTU_TARGET;
        document.getElementById('dd-gap').textContent =
            (gap >= 0 ? '+' : '') + fmtNum(gap, 1) + ' poin';
        const meta = mutuMeta[idx];
        const box = document.getElementById('dd-basis');
        if (box) {
            if (!meta) {
                box.innerHTML = '<p class="small text-muted mb-0">Belum ada pengukuran pada bulan ini.</p>';
            } else {
                box.innerHTML = '';
                const head = document.createElement('p');
                head.className = 'small text-muted mb-1';
                head.textContent = meta.n + ' pengukuran, ' + meta.ok + ' tercapai, '
                    + (meta.n - meta.ok) + ' di bawah target';
                const table = document.createElement('table');
                table.className = 'table table-sm mb-0';
                const thead = table.createTHead().insertRow();
                ['Indikator', 'Capaian', 'Target'].forEach(function (h) {
                    const th = document.createElement('th');
                    th.textContent = h;
                    thead.appendChild(th);
                });
                const tb = table.createTBody();
                meta.rows.forEach(function (r) {
                    const tr = tb.insertRow();
                    tr.insertCell().textContent = r.kode;
                    const cap = tr.insertCell();
                    cap.className = 'font-mono ' + (r.ok ? 'text-success' : 'text-danger');
                    cap.textContent = fmtNum(r.capaian, 1) + ' ' + r.satuan;
                    tr.insertCell().textContent = fmtNum(r.target, 1) + ' ' + r.satuan;
                });
                if (meta.more) {
                    const tr = tb.insertRow();
                    const td = tr.insertCell();
                    td.colSpan = 3;
                    td.className = 'small text-muted';
                    td.textContent = 'dan ' + meta.more + ' indikator lain';
                }
                box.append(head, table);
            }
        }

        const st = document.getElementById('dd-status');
        st.textContent = below ? 'Di bawah Target' : 'Tercapai';
        st.className = 'badge ' + (below
            ? 'bg-danger-subtle text-danger border border-danger-subtle'
            : 'bg-success-subtle text-success border border-success-subtle');
        const btn = document.getElementById('dd-btn-pdca');
        const hint = document.getElementById('dd-hint-null');
        if (MUTU_IND_ID) {
            btn.href = PDCA_URL_BASE + '?indikator=' + MUTU_IND_ID +
                       '&bulan=' + (idx + 1) + '&tahun=' + MUTU_TAHUN;
            btn.classList.remove('d-none');
            hint.classList.add('d-none');
        } else {
            btn.classList.add('d-none');
            hint.classList.remove('d-none');
        }
        new bootstrap.Modal(modalEl).show();
    }

    // 2. Chart Capaian Mutu Bulanan (Combo Bar + Target Line)
    let chartMutu = null;
    const mutuEl = document.getElementById('chartMutuBulanan');
    if (mutuEl) {
        const mutuLabels = {{ chart_mutu_labels_json|safe }};
        const mutuData = {{ chart_mutu_data_json|safe }};
        const mutuColors = {{ chart_mutu_colors_json|safe }};
        const targetLine = {{ chart_mutu_target_line_json|safe }};
        const targetVal = {{ chart_mutu_target_val_json|safe }};
        const hasMutuData = {{ has_monthly_data|yesno:"true,false" }};
        const mutuMeta  = {{ chart_mutu_meta_json|safe }};
        const mutuNama  = {{ chart_mutu_nama_json|safe }};
        const mutuRumus = {{ chart_mutu_rumus_json|safe }};

        if (!hasMutuData) {
            // Tidak ada catatan bulanan: ganti canvas dengan penjelasan sebabnya.
            const empty = document.getElementById('mutuEmpty');
            mutuEl.classList.add('d-none');
            if (empty) { empty.classList.remove('d-none'); empty.classList.add('d-flex'); }
        } else {
        chartMutu = new Chart(mutuEl.getContext('2d'), {
            type: 'bar',
            plugins: [valueLabelsPlugin],
            data: {
                labels: mutuLabels,
                datasets: [
                    {
                        type: 'line',
                        label: `Batas Target (${targetVal}%)`,
                        data: targetLine,
                        borderColor: '#DC2626',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        pointRadius: 0,
                        pointHoverRadius: 0,
                        fill: false,
                        order: 1
                    },
                    {
                        type: 'bar',
                        label: 'Realisasi Capaian (%)',
                        data: mutuData,
                        backgroundColor: mutuColors,
                        borderRadius: 5,
                        maxBarThickness: 38,
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                onClick: function (evt, elements) {
                    if (!elements.length) return;
                    const el = elements[0];
                    if (el.datasetIndex !== 1) return;
                    const val = mutuData[el.index];
                    if (val === null || val === undefined) return;
                    openDrilldown(el.index, val);
                },
                onHover: function (evt, elements) {
                    evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            boxWidth: 14,
                            usePointStyle: true,
                            font: { family: "IBM Plex Sans, sans-serif", size: 11 }
                        }
                    },
                    tooltip: {
                        // ponytail: selalu di atas bar — tooltip tebal (rumus + 
                        // rincian PDCA) tidak boleh menutup label bulan di sumbu X.
                        position: 'top',
                        backgroundColor: 'rgba(20, 28, 46, 0.96)',
                        titleFont: { family: "IBM Plex Sans, sans-serif", size: 12, weight: '700' },
                        bodyFont: { family: "ui-monospace, Menlo, Consolas, monospace", size: 11 },
                        bodySpacing: 4,
                        padding: 12,
                        boxPadding: 4,
                        callbacks: {
                            title: function(items) {
                                const m = items[0].dataIndex;
                                return NAMA_BULAN[m] + ' ' + MUTU_TAHUN +
                                    (mutuMeta[m] ? ` · ${mutuMeta[m].n} pengukuran` : '');
                            },
                            label: function(ctx) {
                                if (ctx.datasetIndex === 0 || ctx.dataset.type === 'line') {
                                    return 'Batas target ' + fmtPct(targetVal);
                                }
                                const meta = mutuMeta[ctx.dataIndex];
                                if (ctx.raw === null || ctx.raw === undefined) {
                                    return ' Belum ada pengukuran bulan ini';
                                }
                                const lines = [
                                    ` Rata-rata    : ${fmtPct(ctx.raw, 2)}`,
                                    ` Target       : ${fmtPct(targetVal)} (${MUTU_ARAH === 'MAX' ? 'maksimal, makin kecil makin baik' : 'minimal, makin besar makin baik'})`,
                                    ` Selisih      : ${(ctx.raw - targetVal >= 0 ? '+' : '')}${fmtNum(ctx.raw - targetVal, 2)} poin`,
                                ];
                                if (meta) {
                                    lines.push(` Tercapai     : ${meta.ok} dari ${meta.n} pengukuran`);
                                    // Setiap indikator penyumbang, apa adanya.
                                    meta.rows.forEach(function (r) {
                                        const mark = r.ok ? '  ' : '  ';
                                        const status = r.ok ? 'tercapai' : 'di bawah target';
                                        lines.push(`   ${mark}${r.kode} ${fmtPct(r.capaian, 1)} dari target ${fmtNum(r.target, 1)} ${r.satuan} (${status})`);
                                    });
                                    if (meta.more) lines.push(`   dan ${meta.more} indikator lain`);
                                }
                                return lines;
                            },
                            afterBody: function(items) {
                                const m = items[0].dataIndex;
                                const meta = mutuMeta[m];
                                const parts = ['', mutuNama];
                                if (mutuRumus) parts.push(`Rumus: ${mutuRumus}`);
                                if (meta && meta.rows.length) {
                                    const r = meta.rows[0];
                                    parts.push(`Contoh hitungan ${r.kode}: ${r.num} ÷ ${r.den} × 100`);
                                }
                                parts.push('Klik bar untuk rincian PDCA bulan ini.');
                                return parts;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 105,
                        ticks: {
                            stepSize: 20,
                            callback: v => fmtNum(v, 0) + '%'
                        },
                        grid: { color: '#EDF1F6' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
        }
    }

    // 2b. Chart Tren Tahunan (Multi-Year Bar + Target Line)
    let chartTahunan = null;
    const tahunanEl = document.getElementById('chartTahunanMulti');
    if (tahunanEl) {
        const thYears  = {{ chart_tahunan_years_json|safe }};
        const thData   = {{ chart_tahunan_data_json|safe }};
        const thColors = {{ chart_tahunan_colors_json|safe }};
        const thMeta   = {{ chart_tahunan_meta_json|safe }};

        chartTahunan = new Chart(tahunanEl.getContext('2d'), {
            type: 'bar',
            plugins: [valueLabelsPlugin],
            data: {
                labels: thYears.map(y => `Tahun ${y}`),
                datasets: [
                    {
                        type: 'line',
                        label: `Batas Target (${MUTU_TARGET}%)`,
                        data: thYears.map(() => MUTU_TARGET),
                        borderColor: '#DC2626',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        pointRadius: 0,
                        fill: false,
                        order: 1
                    },
                    {
                        type: 'bar',
                        label: 'Rata-rata Capaian Tahunan (%)',
                        data: thData,
                        backgroundColor: thColors,
                        borderRadius: 5,
                        maxBarThickness: 46,
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            boxWidth: 14,
                            usePointStyle: true,
                            font: { family: "IBM Plex Sans, sans-serif", size: 11 }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            title: function (items) {
                                const year = thYears[items[0].dataIndex];
                                const meta = thMeta[String(year)];
                                return `Tahun ${year}` + (meta ? ` · ${meta.n} bulan terukur` : '');
                            },
                            label: function (ctx) {
                                if (ctx.dataset.type === 'line') {
                                    return 'Batas target ' + fmtPct(MUTU_TARGET);
                                }
                                const year = thYears[ctx.dataIndex];
                                const meta = thMeta[String(year)];
                                if (ctx.raw === null || ctx.raw === undefined) {
                                    return ' Belum ada pengukuran pada tahun ini';
                                }
                                const lines = [
                                    ` Rata-rata tahunan : ${fmtPct(ctx.raw, 2)}`,
                                    ` Target            : ${fmtPct(MUTU_TARGET)}`,
                                    ` Selisih           : ${(ctx.raw - MUTU_TARGET >= 0 ? '+' : '')}${fmtNum(ctx.raw - MUTU_TARGET, 2)} poin`,
                                ];
                                if (meta) {
                                    lines.push(` Bulan terukur     : ${meta.n} dari 12`);
                                    lines.push(` Rentang bulanan   : ${fmtPct(meta.min)} sampai ${fmtPct(meta.max)}`);
                                }
                                return lines;
                            },
                            afterBody: function (items) {
                                const year = thYears[items[0].dataIndex];
                                const meta = thMeta[String(year)];
                                const parts = [''];
                                if (meta && meta.months && meta.months.length) {
                                    parts.push('Bulan: ' + meta.months.map(m => NAMA_BULAN[m - 1].slice(0, 3)).join(', '));
                                }
                                parts.push(mutuNama);
                                parts.push('Rata-rata tahunan = rata-rata capaian tiap bulan, bukan rasio total numerator.');
                                return parts;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 105,
                        ticks: { stepSize: 20, callback: v => fmtNum(v, 0) + '%' },
                        grid: { color: '#EDF1F6' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    // 3. Chart Tren Renstra 2026-2030 (Grouped Bar Target vs Realisasi)
    let chartRenstra = null;
    const renstraEl = document.getElementById('chartRenstraTahunan');
    if (renstraEl) {
        const renstraYears = {{ chart_renstra_years_json|safe }};
        const renstraTargets = {{ chart_renstra_targets_json|safe }};
        const renstraActuals = {{ chart_renstra_actuals_json|safe }};
        const renstraMeta = {{ chart_renstra_meta_json|safe }};

        chartRenstra = new Chart(renstraEl.getContext('2d'), {
            type: 'bar',
            data: {
                labels: renstraYears.map(y => `Tahun ${y}`),
                datasets: [
                    {
                        label: 'Target Renstra (%)',
                        data: renstraTargets,
                        backgroundColor: '#4F5BD5',
                        borderRadius: 5,
                        maxBarThickness: 34
                    },
                    {
                        label: 'Realisasi Aktual (%)',
                        data: renstraActuals,
                        backgroundColor: '#15803D',
                        borderRadius: 5,
                        maxBarThickness: 34
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            boxWidth: 14,
                            usePointStyle: true,
                            font: { family: "IBM Plex Sans, sans-serif", size: 11 }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            title: function (items) {
                                const year = renstraYears[items[0].dataIndex];
                                const meta = renstraMeta[String(year)];
                                return `Tahun ${year}` + (meta && meta.label ? ` · ${meta.label}` : '');
                            },
                            label: function(ctx) {
                                const year = renstraYears[ctx.dataIndex];
                                const meta = renstraMeta[String(year)];
                                if (ctx.datasetIndex === 0) {
                                    return ' Target Renstra : ' + fmtPct(ctx.raw);
                                }
                                if (ctx.raw === null || ctx.raw === undefined) {
                                    return ' Realisasi      : belum ada pengukuran';
                                }
                                const lines = [
                                    ` Realisasi      : ${fmtPct(ctx.raw, 2)}`,
                                ];
                                if (meta) {
                                    const gap = ctx.raw - meta.target;
                                    lines.push(` Selisih target : ${(gap >= 0 ? '+' : '')}${fmtNum(gap, 2)} poin`);
                                    lines.push(` Pengukuran     : ${meta.tercapai} tercapai dari ${meta.total} catatan`);
                                }
                                return lines;
                            },
                            afterBody: function (items) {
                                const year = renstraYears[items[0].dataIndex];
                                const meta = renstraMeta[String(year)];
                                if (!meta || !meta.has_data) {
                                    return ['', 'Belum ada capaian indikator pada tahun ini.'];
                                }
                                return ['', 'Realisasi = rata-rata capaian indikator yang diukur tahun itu.'];
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 105,
                        ticks: {
                            stepSize: 20,
                            callback: v => fmtNum(v, 0) + '%'
                        },
                        grid: { color: '#EDF1F6' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }

    // Resize listener when switching tab pills
    document.querySelectorAll('#pills-mutu-tab button[data-bs-toggle="pill"]').forEach(function(pill) {
        pill.addEventListener('shown.bs.tab', function() {
            if (chartMutu) chartMutu.resize();
            if (chartRenstra) chartRenstra.resize();
            if (chartTahunan) chartTahunan.resize();
        });
    });
});
</script>

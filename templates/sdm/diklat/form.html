{% extends "base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Usulan kebutuhan pelatihan manual{% endblock %}
{% block content %}
<div class="container-fluid p-0">
    <a class="small text-decoration-none" href="{% url 'sdm:diklat_list' %}"><i class="bi bi-arrow-left me-1"></i>Kembali</a>
    <h1 class="page-title h4 mt-2 mb-3">{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {% include "sdm/_form_card.html" %}
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm">Simpan Usulan</button>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'sdm:diklat_list' %}">Batal</a>
        </div>
    </form>
</div>
{% endblock %}

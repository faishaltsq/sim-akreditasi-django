{% extends "base.html" %}
{% block page_title %}Periode Penilaian Baru{% endblock %}
{% block content %}
<div class="container-fluid p-0" style="max-width: 640px;">
    <div class="card border shadow-sm">
        <div class="card-body">
            <h1 class="page-title h5 mb-3">Periode Penilaian Baru</h1>
            {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Nama Periode</label>
                    <input type="text" name="nama" class="form-control form-control-sm" required placeholder="contoh: Triwulan III 2026">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col">
                        <label class="form-label">Mulai</label>
                        <input type="date" name="tanggal_mulai" class="form-control form-control-sm" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Selesai</label>
                        <input type="date" name="tanggal_selesai" class="form-control form-control-sm" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'sdm:kinerja_list' %}" class="btn btn-outline-secondary btn-sm">Batal</a>
                    <button type="submit" class="btn btn-primary btn-sm">Simpan Periode</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

databases:
  - name: sim-akreditasi-db
    plan: free
    databaseName: sim_akreditasi
    user: sim_akreditasi_user

services:
  - type: web
    name: sim-akreditasi-django
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sim-akreditasi-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SUPABASE_URL
        value: "https://gwaeuzbbdawbekrmrvfd.supabase.co"
      - key: SUPABASE_BUCKET
        value: "bukti-akreditasi"

name: HC Reminders

# Menjalankan sinkron pengingat Human Capital (STR/SIP kedaluwarsa & akan habis,
# dokumen, SPK, orientasi, penilaian kinerja) secara berkala.
# Aplikasi ini di-deploy sebagai web server tanpa scheduler (Procfile hanya
# `web:`), sehingga pemanggilan `manage.py hc_reminders` perlu pihak eksternal.
on:
  schedule:
    # 01:00 WIB = 18:00 UTC hari sebelumnya.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (hanya lapor, tidak menulis)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: hc-reminders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `manage.py hc_reminders` tidak membuat HTTP request maupun login, jadi
      # DJANGO_SECRET_KEY tidak diperlukan. Gagal cepat dengan pesan jelas
      # menggantikan error psycopg2 yang membingungkan bila secret belum di-set.
      - name: Check database secret is configured
        env:
          HC_REMINDERS_DATABASE_URL: ${{ secrets.HC_REMINDERS_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HC_REMINDERS_DATABASE_URL}" ]; then
            echo "::error::Secret HC_REMINDERS_DATABASE_URL belum dikonfigurasi."
            echo "Tambahkan di GitHub: Settings → Secrets and variables → Actions → New repository secret."
            echo "Nilai: connection string Supabase Session pooler (port 5432),"
            echo "bukan direct connection 'db.<ref>.supabase.co' karena host itu hanya IPv6"
            echo "sedangkan runner GitHub Actions hanya IPv4."
            exit 1
          fi
          case "${HC_REMINDERS_DATABASE_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::HC_REMINDERS_DATABASE_URL harus dimulai dengan postgres:// atau postgresql://"
              exit 1
              ;;
          esac
          echo "Secret terkonfigurasi."

      # Web server menjalankan migrate saat startup, jadi DB produksi biasanya
      # sudah terbaru. Langkah ini idempoten dan menjamin skema sesuai bila job
      # berjalan di antara push kode dan restart web.
      - name: Apply pending migrations
        env:
          HC_REMINDERS_DATABASE_URL: ${{ secrets.HC_REMINDERS_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.HC_REMINDERS_DATABASE_URL }}
        run: python manage.py migrate --no-input

      - name: Run reminder sync
        env:
          DATABASE_URL: ${{ secrets.HC_REMINDERS_DATABASE_URL }}
          DJANGO_DEBUG: 'False'
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            python manage.py hc_reminders --dry-run
          else
            python manage.py hc_reminders
          fi
